<!DOCTYPE html>
<html>

<head>
    <title>Campus Club and Travel Buddy</title>
</head>

<body>

<h1>Campus Club Members</h1>

<form action="/members" method="POST">

    Member ID:
    <input type="text" name="memberId">
    <br><br>

    Name:
    <input type="text" name="memberName">
    <br><br>

    Email:
    <input type="email" name="memberEmail">
    <br><br>

    Club:
    <input type="text" name="club">
    <br><br>

    <button type="submit">
        Add Member
    </button>

</form>


<hr>


<h1>Travel Buddy Finder</h1>

<form action="/travellers" method="POST">

    Traveller ID:
    <input type="text" name="travellerId">
    <br><br>

    Name:
    <input type="text" name="travellerName">
    <br><br>

    Email:
    <input type="email" name="travellerEmail">
    <br><br>

    Destination:
    <input type="text" name="destination">
    <br><br>

    <button type="submit">
        Add Traveller
    </button>

</form>

</body>

</html>
